name: ci

# Remediation 2.4. Before this file existed, a pull request touching only `src/` ran
# NO automated check at all — the sole workflow (migration-drift.yml) is path-filtered
# to supabase/migrations/** and is explicitly designed not to gate. That is why eight
# high-severity advisories accumulated unnoticed: nothing was watching.
#
# Two jobs, deliberately separate. `checks` is fast and runs on every push. `isolation`
# stands up a real Postgres, applies every migration, and runs the security harnesses —
# slower, and the one that actually protects the audit result.
#
# `isolation` IS a required status check on main (registered 2026-07-27, once the
# 20260726* batch reached production and the L7 step below went blocking). It converts the
# strongest finding of the audit (140 cross-tenant attempts, zero breaches) from a
# point-in-time result into a standing control, so a future policy or permission change
# that quietly loosens isolation fails the build instead of shipping.
#
# Every step in `isolation` is now blocking. If you add a step here, it gates main — add it
# green or add it advisory deliberately, with the reason written down, the way the lint step
# below is.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile also enforces audit row J1 on every PR: the install fails if
      # package.json and pnpm-lock.yaml have drifted apart.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      # Gated at `high`, not at the default. The one surviving advisory is uuid<11.1.1
      # via exceljs (moderate) — a three-major jump on a transitive dependency of the
      # export engine, deliberately not forced. Raise this to `moderate` once that is
      # resolved, and see pnpm-workspace.yaml for the brace-expansion exception.
      - name: Dependency audit (high and above)
        run: pnpm audit --audit-level high

      # NON-BLOCKING ON PURPOSE, and this should not stay that way. `pnpm lint` currently
      # reports 841 errors and 8727 warnings, all pre-existing — verified by stashing the
      # 2.1 dependency bump and re-running, identical output. A gate that is red on day
      # one gets ignored, and an ignored gate is worse than no gate. Burn the backlog
      # down, then delete this line.
      - name: Lint (advisory until the existing backlog is cleared)
        run: pnpm lint
        continue-on-error: true

  isolation:
    name: isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # PINNED, not `latest`. Tracking latest made the database non-reproducible: a newer
      # CLI ships a newer Postgres image whose bootstrap no longer runs
      # `ALTER DEFAULT PRIVILEGES ... GRANT ALL ON TABLES TO anon, authenticated,
      # service_role`. Not one migration in this repo issues an explicit GRANT — all 26
      # tables inherit their privileges from that default — so on `latest` the whole schema
      # comes up with no table privileges for `authenticated` and pgTAP dies with
      # "permission denied for table vendors".
      #
      # 2.102.0 is what the local stack runs and what matches production (verified against
      # a live schema dump: prod grants ALL on every table to authenticated, same as local).
      # Keep CI, local and prod on the same version until the migrations state their grants
      # explicitly — until then the platform default IS the schema, and a floating CLI
      # silently changes it.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.102.0

      - name: Install
        run: pnpm install --frozen-lockfile

      # Applies every migration in supabase/migrations to a clean database. This is also
      # the only place the new 20260726* migrations get executed end to end — they are
      # written but deliberately not applied to any developer database.
      - name: Start Supabase
        run: supabase start

      # Ordinary pgTAP only. `screener_concurrency_test.sql` needs supabase_admin
      # (dblink); the default `postgres` role is not superuser and that file must
      # not run in this step. The helper lists every supabase/tests/*.sql except
      # that one name, sorted, so a new ordinary test is included automatically.
      - name: Database tests (pgTAP)
        run: |
          set -euo pipefail
          inventory="$(mktemp)"
          cleanup_inventory() { rm -f "$inventory"; }
          trap cleanup_inventory EXIT
          # Helper is a normal command. Its exit status is required. Do not
          # consume a partially written inventory from a failed helper.
          scripts/db/ordinary-pgtap-files.sh > "$inventory"
          files=()
          file_count=0
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            files+=("$f")
            file_count=$((file_count + 1))
          done < "$inventory"
          test "$file_count" -gt 0
          supabase test db "${files[@]}"

      # Real 26-assertion two-session harness against the already-started local
      # CI database. Uses the image's documented local supabase_admin default
      # (not a production secret). Fails this required job if the harness fails.
      - name: Concurrent screener harness (privileged, local)
        run: |
          set -euo pipefail
          supabase test db \
            --db-url "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" \
            supabase/tests/screener_concurrency_test.sql

      # Baselined: fails on a NEW isolation failure, not on the known-open ones. The
      # baseline and the reason for each entry live at the foot of the script.
      - name: Cross-org isolation (B3)
        run: node scripts/security/run-local-harness.mjs b3

      # Exits non-zero if any path can deliver a title that never passed chain-of-title
      # review.
      #
      # BLOCKING as of 2026-07-27. It was advisory while `main` still had the L7 gap: the
      # delivery-gate migration (20260726000100) was written but unmerged, so the step
      # reported 6 ungated paths and exited 1 — a correct result, not a broken step.
      # 000100 is now merged AND applied to production, and the step reports 10 GATED /
      # 1 UNGATED (deliberate) / 2 SKIPPED, exit 0.
      #
      # The one UNGATED path is Q2d, create_screener_link on an unreviewed title, and it is
      # deliberate: screening is HOW review is performed, and the RPC is gc_staff-only. The
      # script encodes that as an expected result rather than a failure. If you decide to
      # add the narrower "must be submitted" floor — it is written into 20260726000100 as an
      # unapplied comment — this step's expectation moves with it.
      #
      # The 2 SKIPPED are declared unproven, not passed. See the script's own footer; a
      # SKIP must never be allowed to read as a pass.
      - name: Chain-of-title delivery gate (L7)
        run: node scripts/security/run-local-harness.mjs l7

      # `if: always()` also runs when an earlier step failed before the CLI was installed,
      # where `supabase stop` is exit 127 and turns a clear failure into two. Tolerate it.
      - name: Stop Supabase
        if: always()
        run: supabase stop || true

  # Non-required advisory job. Full-history secret scan and repository policy checks use only Node
  # built-ins plus a checksum-pinned Gitleaks CLI download — no pnpm install.
  governance:
    name: governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned Gitleaks v8.30.0
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          VERSION=8.30.0
          ASSET="gitleaks_${VERSION}_linux_x64.tar.gz"
          CHECKSUM=79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ASSET}"
          ARCHIVE_PATH="${RUNNER_TEMP}/${ASSET}"
          EXTRACT_DIR="${RUNNER_TEMP}/gitleaks-${VERSION}"
          MODULE="${GITHUB_WORKSPACE}/scripts/governance/gitleaks-archive.py"

          for tool in curl python3; do
            command -v "${tool}" >/dev/null
          done

          python3 -B scripts/governance/gitleaks-archive.test.py

          curl -fsSL -o "${ARCHIVE_PATH}" "${URL}"
          case "${ARCHIVE_PATH}" in
            "${RUNNER_TEMP}"/*) ;;
            *) echo "governance: archive path must stay under RUNNER_TEMP"; exit 1 ;;
          esac
          case "${ARCHIVE_PATH}" in
            "${GITHUB_WORKSPACE}"/*) echo "governance: archive must not live in checkout"; exit 1 ;;
          esac

          python3 -B "${MODULE}" verify-digest "${ARCHIVE_PATH}" "${CHECKSUM}"

          python3 -B "${MODULE}" install "${ARCHIVE_PATH}" "${EXTRACT_DIR}/gitleaks" --runner-temp "${RUNNER_TEMP}"

          test -f "${EXTRACT_DIR}/gitleaks"
          test -s "${EXTRACT_DIR}/gitleaks"
          test -x "${EXTRACT_DIR}/gitleaks"
          test "$("${EXTRACT_DIR}/gitleaks" version)" = "${VERSION}"
          test ! -e "${GITHUB_WORKSPACE}/gitleaks"
          test ! -e "${GITHUB_WORKSPACE}/${ASSET}"
          echo "GITLEAKS_BIN=${EXTRACT_DIR}/gitleaks" >> "${GITHUB_ENV}"

      - name: Governance CI suite
        run: pnpm run governance:check:policy && pnpm run governance:ci:scans
