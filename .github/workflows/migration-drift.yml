name: migration-drift

# Guards against the failure we hit twice: code merged to main auto-deploys on Vercel, but
# applying the DB migration is a separate manual step — so main can carry a migration the prod
# DB doesn't have yet, and pages that read the new column/RPC 404 in production.
#
# This never gates the Vercel deploy. It fails its own check so drift is loud.
#
# Requires ONE repo secret. Until it is set the job no-ops (green), so this can merge before it
# exists:
#   SUPABASE_DB_PASSWORD — the prod project's database password
#
# ─── WHY THERE IS NO SUPABASE_ACCESS_TOKEN ANY MORE ──────────────────────────────────────────
# This used to run `supabase link` + `migration list --linked`, and `link` needs an account
# access token. That token is ACCOUNT-scoped — there is no per-project variant — and this
# account holds 13 projects including Watershed Portal and Royalogic. A drift check on one
# database does not need reach over all of them.
#
# A `psql` SELECT against supabase_migrations.schema_migrations does the same job with no token
# at all — and, after one failed attempt at `supabase migration list --db-url`, without putting
# the password into a URL either. See the step body for why that mattered.
#
# ─── WHY THE POOLER HOST AND NOT db.<ref>.supabase.co ────────────────────────────────────────
# The direct host is IPv6-ONLY — it publishes an AAAA record and no A record. GitHub-hosted
# runners are IPv4-only, so a direct connection fails outright. The session pooler resolves to
# IPv4. Neither the host nor the username is a secret; only the password is.
#
# ─── WHY NO pull_request TRIGGER ─────────────────────────────────────────────────────────────
# On a same-repo `pull_request`, secrets are injected AND the workflow file that executes is the
# one from the PR head. Any branch could edit this file to print the secret and open a PR;
# branch protection does not help, because the run happens before the merge. `push` to main does
# not have this property — the definition comes from a commit already on the protected branch.
#
# The `schedule` replaces what the PR trigger was for, and covers more: prod going AHEAD of main
# does not touch supabase/migrations/** in the repo, so the path-filtered triggers could miss it
# entirely. That is exactly the 000700 shape — a migration applied to prod whose file was not on
# main. A schedule has no path filter and catches it either way.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  # ⏸ SCHEDULE PAUSED 2026-07-27 — there is no working database credential yet, so an hourly
  # run would be an hourly failure email, and a control you learn to ignore is worse than one
  # you know is off. Restore this the moment `drift_reader` exists and its password is set
  # (docs/scheduled/drift-reader-role.md). :17 rather than :00 because the top of the hour is
  # when GitHub's scheduler is most congested and cron runs are most likely to be dropped.
  #
  # schedule:
  #   - cron: "17 * * * *"
  workflow_dispatch: {} # manual "Run workflow" button — ignores path filters

permissions:
  contents: read

concurrency:
  group: migration-drift
  cancel-in-progress: false

env:
  PROJECT_REF: uevsculwzwlhxeamagwg # GC dashboard PROD Supabase project
  # Session pooler (IPv4). Region is us-west-2; see supabase/.temp/pooler-url.
  DB_HOST: aws-1-us-west-2.pooler.supabase.com
  # drift_reader, not postgres. Created 2026-07-27; reads supabase_migrations.schema_migrations
  # and nothing else — verified against the production catalog: 0 readable tables in `public`
  # while the same probe finds 27 for `authenticated`. See docs/scheduled/drift-reader-role.md.
  DB_USER: drift_reader.uevsculwzwlhxeamagwg

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is the Supabase DB password configured?
        id: guard
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::SUPABASE_DB_PASSWORD not set — skipping the migration-drift check. Add the repo secret to enable it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # NO SUPABASE CLI. This step used to be `supabase migration list`, which needs the
      # password inside a percent-encoded connection string — and that is what broke it:
      # `failed SASL auth ... password authentication failed`, while the same secret had
      # worked for weeks via `--linked`. The URL round-trip is an entire class of bug
      # (encoding, quoting, a stray newline in the secret) sitting between the credential and
      # the query, in service of one SELECT.
      #
      # `psql` takes the password out of band in PGPASSWORD, so there is nothing to encode,
      # nothing for GitHub to fail to mask, and no CLI version coupling. postgresql-client
      # ships in the ubuntu-latest runner image; the guard below fails loudly if that changes.

      # SYMMETRIC. The original version ran `db push --dry-run` and grepped for pending
      # filenames, which only ever detects PROD BEHIND MAIN. It is blind to the opposite
      # direction, and the opposite direction happened: a `db push` run from a feature
      # branch applied a migration to production that was not yet on main. Production sat
      # ahead of main and this workflow would have reported "in sync" — the exact drift the
      # control exists to catch, invisible to it.
      #
      # The comparison is a set difference between the migration FILENAMES in the repo and the
      # `version` column of the remote ledger. In the repo but not the ledger -> prod is BEHIND.
      # In the ledger but not the repo -> prod is AHEAD, which is the worse case: the schema
      # cannot be reproduced from the repository, and a rebuild silently loses it.
      - name: Compare migrations against prod, in BOTH directions
        if: steps.guard.outputs.skip != 'true'
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -uo pipefail

          command -v psql >/dev/null || {
            echo "::error::psql is not on this runner. postgresql-client used to ship in the ubuntu-latest image; add a setup step."
            exit 1
          }

          # Password travels in PGPASSWORD, never in the URL — nothing to percent-encode, and
          # GitHub's automatic masking of the raw secret is sufficient.
          conn="postgresql://${DB_USER}@${DB_HOST}:5432/postgres?sslmode=require"

          # `shell: bash -e` aborts on a failing command-substitution assignment BEFORE the next
          # line can echo what went wrong, so a credential failure otherwise produces a bare
          # "exit code 1" with no diagnostic. Capture the status explicitly.
          if ! remote_raw="$(psql "$conn" -tAX -c \
                "select version from supabase_migrations.schema_migrations order by version" 2>&1)"; then
            echo "$remote_raw"
            echo "::error::Could not read the remote migration ledger. Connection or credential failure, NOT a drift result — the comparison never happened."
            exit 1
          fi

          remote="$(printf '%s\n' "$remote_raw" | tr -d ' \r' | grep -E '^[0-9]{14}$' | sort -u)"
          local_="$(ls supabase/migrations/*.sql 2>/dev/null | xargs -n1 basename \
                    | grep -oE '^[0-9]{14}' | sort -u)"

          nr="$(printf '%s' "$remote" | grep -c . || true)"
          nl="$(printf '%s' "$local_" | grep -c . || true)"
          echo "ledger rows: ${nr}   migration files: ${nl}"

          # An empty result is not "in sync" — it is a query that proved nothing. A successful
          # connection to the WRONG database would also land here.
          if [ "$nr" -eq 0 ]; then
            echo "::error::The remote ledger returned zero rows. That is a connection or wrong-database failure, NOT a clean result."
            exit 1
          fi
          if [ "$nl" -eq 0 ]; then
            echo "::error::No migration files found in supabase/migrations. Checkout or path failure, NOT a clean result."
            exit 1
          fi

          behind="$(comm -23 <(printf '%s\n' "$local_") <(printf '%s\n' "$remote"))"
          ahead="$(comm -13 <(printf '%s\n' "$local_") <(printf '%s\n' "$remote"))"

          rc=0
          if [ -n "$behind" ]; then
            n="$(printf '%s' "$behind" | grep -c .)"
            echo "::error::Prod DB is BEHIND main by ${n} migration(s): $(echo "$behind" | paste -sd', ' -). Apply them from a clean main checkout."
            rc=1
          fi
          if [ -n "$ahead" ]; then
            n="$(printf '%s' "$ahead" | grep -c .)"
            echo "::error::Prod DB is AHEAD of main by ${n} migration(s) with NO file in the repo: $(echo "$ahead" | paste -sd', ' -). The schema cannot be rebuilt from migrations. Land the file on main, or roll the change back."
            rc=1
          fi

          if [ "$rc" -eq 0 ]; then
            echo "Prod DB and main are in sync, both directions. ✓"
          fi

          # NO EVENT-NAME BRANCH. The previous version downgraded "behind" to a warning whenever
          # the event was not `push`, which was written for the pull_request trigger. With that
          # trigger gone, every remaining trigger — push to main, schedule, manual — is
          # authoritative, and the old condition would have made SCHEDULED runs pass silently
          # while prod sat behind main. A control that cannot fail on its own schedule is not a
          # control.
          exit "$rc"
