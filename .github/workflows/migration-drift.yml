name: migration-drift

# Guards against the failure we hit twice: code merged to main auto-deploys on Vercel, but
# applying the DB migration is a separate manual step — so main can carry a migration the prod
# DB doesn't have yet, and pages that read the new column/RPC 404 in production.
#
# This is a WARNING/notify check, deliberately NOT a build block: it never gates the Vercel
# deploy (blocking the app on prod-DB reachability would be fragile). On a push to main it fails
# the check (red X) so drift is loud; on a PR it emits a warning so you see it coming.
#
# Requires two repo secrets. Until they're set the job no-ops (green), so this can merge before
# they exist:
#   SUPABASE_ACCESS_TOKEN  — a Supabase account access token (Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   — the prod project's database password

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  pull_request:
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {} # manual "Run workflow" button — runs regardless of path filters

permissions:
  contents: read

env:
  PROJECT_REF: uevsculwzwlhxeamagwg # GC dashboard PROD Supabase project

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Are the Supabase secrets configured?
        id: guard
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Supabase secrets not set — skipping the migration-drift check. Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD repo secrets to enable it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.skip != 'true'
        with:
          version: latest

      # SYMMETRIC. The original version ran `db push --dry-run` and grepped for pending
      # filenames, which only ever detects PROD BEHIND MAIN. It is blind to the opposite
      # direction, and the opposite direction happened: a `db push` run from a feature
      # branch applied a migration to production that was not yet on main. Production sat
      # ahead of main and this workflow would have reported "in sync" — the exact drift the
      # control exists to catch, invisible to it.
      #
      # `migration list --linked` prints Local | Remote | Time, so both directions are
      # readable from one call. A blank Remote means prod is behind; a blank Local means
      # prod has a migration with no file in the repo, which is the worse case: the schema
      # cannot be reproduced from the repository, and a rebuild silently loses it.
      - name: Compare migrations against prod, in BOTH directions
        if: steps.guard.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -uo pipefail
          supabase link --project-ref "$PROJECT_REF"

          out="$(supabase migration list --linked 2>&1)"
          echo "$out"

          # Rows look like:  20260726000600 | 20260726000600 | 2026-07-26 00:06:00
          # Local-only  -> prod is BEHIND.  Remote-only -> prod is AHEAD.
          behind="$(echo "$out" | awk -F'|' '
            $1 ~ /[0-9]{14}/ && $2 !~ /[0-9]{14}/ { gsub(/ /,"",$1); print $1 }')"
          ahead="$(echo "$out" | awk -F'|' '
            $2 ~ /[0-9]{14}/ && $1 !~ /[0-9]{14}/ { gsub(/ /,"",$2); print $2 }')"

          rc=0
          if [ -n "$behind" ]; then
            n="$(echo "$behind" | wc -l | tr -d ' ')"
            echo "::error::Prod DB is BEHIND main by ${n} migration(s): $(echo "$behind" | paste -sd', ' -). Apply them from a clean main checkout."
            rc=1
          fi
          if [ -n "$ahead" ]; then
            n="$(echo "$ahead" | wc -l | tr -d ' ')"
            # Always an error, on PRs too. Prod holding a migration that main does not means
            # the schema is not reproducible from the repo — a broken DR and staging path.
            echo "::error::Prod DB is AHEAD of main by ${n} migration(s) with NO file in the repo: $(echo "$ahead" | paste -sd', ' -). The schema cannot be rebuilt from migrations. Land the file on main, or roll the change back."
            rc=1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "Prod DB and main are in sync, both directions. ✓"
            exit 0
          fi

          # `behind` on a PR stays advisory — it is usually just "not applied yet". `ahead`
          # is never advisory: it means the repo has already lost the schema.
          if [ "$GITHUB_EVENT_NAME" != "push" ] && [ -z "$ahead" ]; then
            echo "PR event and prod is only behind — warning, not a failure."
            exit 0
          fi
          exit 1
