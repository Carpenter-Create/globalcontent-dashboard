# Single-package repo — this file holds pnpm settings (pnpm 11 moved them here
# out of package.json).
#
# Trusted native deps allowed to run install scripts:
# sharp = image processing (Next.js image optimization),
# unrs-resolver = eslint import resolver.
allowBuilds:
  sharp: true
  unrs-resolver: true

# Transitive-only security floors (audit 2.1). Neither is a direct dependency, so they
# are pinned here rather than added to package.json:
#   postcss  >=8.5.18  arbitrary file read + path traversal (+ XSS in CSS stringify)
#   sharp    >=0.35.0  inherited libvips CVE-2026-33327
#
# DELIBERATELY NOT OVERRIDDEN — brace-expansion (>=5.0.8 would fix a high-severity DoS):
# v5 changed its export shape, and minimatch@3 calls it as a default function. Forcing it
# breaks ESLint outright ("TypeError: expand is not a function") and, less visibly, puts a
# broken minimatch under exceljs -> archiver -> glob, i.e. the .xlsx export path. Tried and
# reverted. The advisory needs a crafted glob pattern; nothing in this app routes user input
# into a glob (exceljs uses it internally for archive handling, ESLint for config matching).
# Accepted exception — revisit when exceljs/archiver move off glob@7.
overrides:
  postcss: '>=8.5.18'
  sharp: '>=0.35.0'

# The brace-expansion exception above, declared so `pnpm audit --audit-level high` is
# honest rather than either permanently red or quietly downgraded. An exception you can
# see in a config file is a decision; an exception you carry by lowering the gate is a
# habit. CI (.github/workflows/ci.yml) fails on any OTHER high advisory.
#
# GHSA-mh99-v99m-4gvg — brace-expansion DoS via unbounded expansion.
#   Reached only as: exceljs > archiver > (archiver-utils|zip-stream) > glob@7 > minimatch@3
#   Unfixable in place: the fix lands in 5.0.8 only. 1.1.16 and 2.1.2 are the newest of
#   their lines and both remain vulnerable, so there is no backport minimatch@3 can take,
#   and forcing 5.x breaks it (see above).
#   Real fix: exceljs/archiver moving off glob@7. Re-check on every exceljs bump.
#   Exposure: requires a crafted glob pattern. Nothing in this app routes user input into
#   a glob — exceljs uses it internally for archive handling.
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg

